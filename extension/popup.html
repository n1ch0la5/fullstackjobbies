<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rate a job</title>
<style>
  body { margin: 0; width: 360px; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; color: #1A1712; background: #FFF4CC; }
  main { padding: 16px; display: grid; gap: 10px; }
  h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.01em; }
  p { margin: 0; color: #3D372C; }
  label { font-weight: 600; }
  textarea { width: 100%; box-sizing: border-box; min-height: 140px; font: 13px/1.45 ui-monospace, monospace; padding: 10px; border: 2px solid #1A1712; border-radius: 10px; background: #fff; resize: vertical; }
  button { font-family: inherit; font-size: 15px; font-weight: 700; padding: 10px 14px; border: 2px solid #1A1712; border-radius: 10px; background: #2F5BFF; color: #fff; box-shadow: 3px 3px 0 #1A1712; cursor: pointer; }
  button:focus-visible, textarea:focus-visible { outline: 3px solid #2F5BFF; outline-offset: 2px; }
  #out { display: grid; gap: 6px; }
  .big { font-size: 22px; font-weight: 800; }
  ul { margin: 0; padding-left: 18px; }
  small { color: #5C5444; }
  a { color: #1A1712; }
</style>
</head>
<body>
<main>
  <h1>💩→🚀 Rate a job</h1>
  <p>On Greenhouse, Lever and Ashby job pages the rating appears by itself. Anywhere else, select the job text and right-click, or paste it here.</p>
  <label for="text">Job description</label>
  <textarea id="text" placeholder="Paste the listing…"></textarea>
  <button id="go" type="button">Sniff it out</button>
  <div id="out" aria-live="polite"></div>
  <small>Runs in your browser; nothing is sent anywhere. <a href="https://fullstackjobbies.com/jobs?ref=extension" target="_blank" rel="noopener">Browse rated jobs</a> · <a href="#" id="prefs">Set your preferences</a></small>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
