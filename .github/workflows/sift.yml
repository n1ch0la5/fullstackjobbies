name: Daily sift

on:
  schedule:
    - cron: "17 10 * * *" # every day, ~5am New York
  workflow_dispatch: {}   # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: sift
  cancel-in-progress: false

jobs:
  sift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Sift jobs
        run: npm run sift
        env:
          # Optional. Without it the sifter uses its free rule-based extraction only.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_AI_PER_RUN: "150"
      - name: Commit fresh data
        run: |
          git config user.name "jobbies-sifter"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "Daily sift: $(date -u +%F)"
            git push
          fi
